<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calc & Notes</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2e;--soft:#202b45;--line:#2c3955;--text:#f2f5ff;--muted:#a8b3ca;--accent:#8b9cff;--red:#ff9b9b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#182544,var(--bg) 65%);font:16px/1.5 system-ui,sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}button,input,textarea{font:inherit}button{border:0;color:inherit;cursor:pointer}.app{width:min(100%,430px)}.card{background:#121a2ef7;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 24px 80px #0008}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-weight:750;font-size:20px}.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 10px}.display{min-height:104px;border-radius:16px;background:#080d1b;padding:15px 18px;margin-bottom:14px;text-align:right;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.previous{height:24px;color:var(--muted);font-size:14px}.current{font-size:36px;font-weight:600;white-space:nowrap;overflow-x:auto}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.key{min-height:60px;background:var(--soft);border-radius:14px;font-size:20px}.key.op{color:var(--accent);font-weight:700}.key.equals{background:var(--accent);color:#0b1020;font-weight:800}.key.clear{color:var(--red)}.key.zero{grid-column:span 2}.hint,.privacy{font-size:12px;color:var(--muted);text-align:center;margin:15px 0 0}.status{min-height:24px;color:var(--red);font-size:13px;text-align:center;margin-top:8px}.notes{width:min(100%,820px)}.notes .card{padding:26px}.notes-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}.notes-head h1{margin:0;font-size:24px}.notes-head p{margin:4px 0 0;color:var(--muted);font-size:14px}.actions{display:flex;gap:9px;flex-wrap:wrap}.action{padding:10px 14px;background:var(--soft);border-radius:12px}.action.primary{background:var(--accent);color:#0b1020;font-weight:700}.editor{display:grid;grid-template-columns:1fr 1.3fr;gap:22px}.form{display:flex;flex-direction:column;gap:11px}.field{width:100%;border:1px solid var(--line);background:#080d1b;color:var(--text);border-radius:12px;padding:12px 14px;outline:none}.field:focus{border-color:var(--accent)}textarea.field{resize:vertical;min-height:175px}.form-actions{display:flex;gap:8px}.note-list{display:flex;flex-direction:column;gap:9px;max-height:460px;overflow:auto}.note{border:1px solid var(--line);background:#0d1425;border-radius:14px;padding:13px 14px;cursor:pointer}.note.selected,.note:hover{border-color:var(--accent)}.note h2{font-size:15px;margin:0 0 4px}.note p{font-size:13px;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note time{font-size:11px;color:#8492ad;display:block;margin-top:8px}.empty{color:var(--muted);font-size:14px;padding:20px;text-align:center;border:1px dashed var(--line);border-radius:14px}@media(max-width:640px){body{padding:14px}.editor{grid-template-columns:1fr}.notes-head{flex-direction:column}.note-list{max-height:260px}.card{padding:19px}.key{min-height:56px}}
</style></head><body>
<main id="calculator" class="app"><section class="card"><div class="top"><div class="brand">Calc &amp; Notes</div><span class="tag">Calculator</span></div><div class="display" aria-live="polite"><div id="previous" class="previous"></div><div id="current" class="current">0</div></div><div class="keys" id="keys">
<button class="key clear" data-action="clear">AC</button><button class="key" data-action="delete">DEL</button><button class="key op" data-op="%">%</button><button class="key op" data-op="/">÷</button>
<button class="key" data-digit="7">7</button><button class="key" data-digit="8">8</button><button class="key" data-digit="9">9</button><button class="key op" data-op="*">×</button>
<button class="key" data-digit="4">4</button><button class="key" data-digit="5">5</button><button class="key" data-digit="6">6</button><button class="key op" data-op="-">−</button>
<button class="key" data-digit="1">1</button><button class="key" data-digit="2">2</button><button class="key" data-digit="3">3</button><button class="key op" data-op="+">+</button>
<button class="key zero" data-digit="0">0</button><button class="key" data-action="decimal">.</button><button class="key equals" data-action="equals">=</button></div><p class="hint">Basic arithmetic · Enter the demo access code and press = to open notes</p><div id="calc-status" class="status" role="status"></div></section></main>
<main id="notes" class="app notes" hidden><section class="card"><header class="notes-head"><div><h1>Private Notes</h1><p>Your notes are stored in this browser on this device.</p></div><div class="actions"><button class="action" id="new-note">New note</button><button class="action" id="exit-notes">Back to calculator</button></div></header><div class="editor"><form id="note-form" class="form"><input id="note-title" class="field" maxlength="100" placeholder="Note title" aria-label="Note title" required><textarea id="note-body" class="field" placeholder="Write your note…" aria-label="Note text"></textarea><div class="form-actions"><button class="action primary" type="submit">Save note</button><button class="action" type="button" id="delete-note" disabled>Delete</button></div><div id="note-status" class="status" role="status"></div></form><section aria-label="Saved notes"><div id="note-list" class="note-list"></div></section></div><p class="privacy">Local storage is not encrypted. Anyone using this browser profile may be able to access these notes.</p></section></main>
<script>
(()=>{const ACCESS_CODE='2580',KEY='calc-notes-v1',$=id=>document.getElementById(id);let cur='0',prev='',op=null,overwrite=false,selected=null;const calc=$('calculator'),notes=$('notes');function render(){ $('current').textContent=cur;$('previous').textContent=prev }function clear(){cur='0';prev='';op=null;overwrite=false;$('calc-status').textContent='';render()}function digit(n){$('calc-status').textContent='';if(overwrite||cur==='Error'){cur=n;overwrite=false}else if(cur==='0')cur=n;else if(cur.replace('-','').length<16)cur+=n;render()}function decimal(){if(overwrite||cur==='Error'){cur='0.';overwrite=false}else if(!cur.includes('.'))cur+='.';render()}function choose(o){if(cur==='Error')return;if(op&&!overwrite)compute();prev=cur;op=o;overwrite=true;render()}function compute(){if(!op||cur==='Error')return;const a=Number(prev),b=Number(cur);let v;if(op==='/'&&b===0){cur='Error';prev='';op=null;overwrite=true;$('calc-status').textContent='Cannot divide by zero.';render();return}if(op==='+')v=a+b;else if(op==='-')v=a-b;else if(op==='*')v=a*b;else if(op==='/')v=a/b;else v=a%b;if(!Number.isFinite(v)){cur='Error';$('calc-status').textContent='That result cannot be displayed.'}else{cur=String(Number(v.toPrecision(12)));$('calc-status').textContent=''}prev='';op=null;overwrite=true;render()}function enterNotes(){calc.hidden=true;notes.hidden=false;resetForm();draw()}$('keys').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.digit!==undefined)digit(b.dataset.digit);else if(b.dataset.op)choose(b.dataset.op);else if(b.dataset.action==='clear')clear();else if(b.dataset.action==='delete'){if(!overwrite){cur=cur.length<=1||cur==='Error'?'0':cur.slice(0,-1);render()}}else if(b.dataset.action==='decimal')decimal();else if(b.dataset.action==='equals'){if(cur===ACCESS_CODE&&!op)enterNotes();else compute()}};document.addEventListener('keydown',e=>{if(!notes.hidden)return;if(/^[0-9]$/.test(e.key))digit(e.key);else if(e.key==='.')decimal();else if(['+','-','*','/','%'].includes(e.key))choose(e.key);else if(e.key==='Enter'||e.key==='='){e.preventDefault();if(cur===ACCESS_CODE&&!op)enterNotes();else compute()}else if(e.key==='Backspace'){cur=cur.length<=1?'0':cur.slice(0,-1);render()}else if(e.key==='Escape')clear()});function all(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch{return []}}function save(a){localStorage.setItem(KEY,JSON.stringify(a))}function resetForm(){selected=null;$('note-title').value='';$('note-body').value='';$('delete-note').disabled=true;$('note-status').textContent=''}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function draw(){const a=all().sort((x,y)=>y.updatedAt-x.updatedAt);$('note-list').innerHTML=a.length?a.map(n=>`<article class="note ${n.id===selected?'selected':''}" data-id="${esc(n.id)}"><h2>${esc(n.title||'Untitled')}</h2><p>${esc(n.body||'No text')}</p><time>Updated ${new Date(n.updatedAt).toLocaleString()}</time></article>`).join(''):'<div class="empty">No notes yet. Create one to get started.</div>'}$('new-note').onclick=()=>{resetForm();$('note-title').focus()};$('note-list').onclick=e=>{const c=e.target.closest('.note');if(!c)return;const n=all().find(x=>x.id===c.dataset.id);if(n){selected=n.id;$('note-title').value=n.title;$('note-body').value=n.body;$('delete-note').disabled=false;$('note-status').textContent='';draw()}};$('note-form').onsubmit=e=>{e.preventDefault();const title=$('note-title').value.trim();if(!title){$('note-status').textContent='Please add a title.';return}const a=all(),now=Date.now();if(selected){const n=a.find(x=>x.id===selected);if(n){n.title=title;n.body=$('note-body').value;n.updatedAt=now}}else{selected=crypto.randomUUID();a.push({id:selected,title,body:$('note-body').value,createdAt:now,updatedAt:now})}save(a);$('delete-note').disabled=false;$('note-status').textContent='Saved.';draw()};$('delete-note').onclick=()=>{if(selected){save(all().filter(n=>n.id!==selected));resetForm();draw()}};$('exit-notes').onclick=()=>{notes.hidden=true;calc.hidden=false;clear()};render()})();
</script></body></html>
